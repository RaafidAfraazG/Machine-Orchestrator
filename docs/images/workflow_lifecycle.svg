<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title">
<title id="title">Workflow lifecycle</title>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs>
<rect x="2" y="2" width="1196" height="506" rx="20" fill="white" stroke="#e2e8f0"/>
<g font-family="DejaVu Sans, sans-serif" fill="#0f172a">
<text x="600.0" y="40" text-anchor="middle" font-size="27" font-weight="bold" fill="#0f172a">Workflow lifecycle</text>
<rect x="60" y="90" width="200" height="80" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="160.0" y="125.0" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">Pending</text>
<text x="160.0" y="151.0" text-anchor="middle" font-size="17" font-weight="normal" fill="#334155">Submitted</text>
<rect x="380" y="90" width="200" height="80" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="480.0" y="125.0" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">Running</text>
<text x="480.0" y="151.0" text-anchor="middle" font-size="17" font-weight="normal" fill="#334155">Advance steps</text>
<rect x="900" y="90" width="220" height="80" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<text x="1010.0" y="125.0" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">Completed</text>
<text x="1010.0" y="151.0" text-anchor="middle" font-size="17" font-weight="normal" fill="#334155">All steps done</text>
<rect x="60" y="310" width="200" height="80" rx="14" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<text x="160.0" y="345.0" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">Blocked</text>
<text x="160.0" y="371.0" text-anchor="middle" font-size="17" font-weight="normal" fill="#334155">Waiting for locks</text>
<rect x="560" y="310" width="220" height="80" rx="14" fill="#fff1f2" stroke="#be123c" stroke-width="2"/>
<text x="670.0" y="345.0" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">Failed</text>
<text x="670.0" y="371.0" text-anchor="middle" font-size="17" font-weight="normal" fill="#334155">Reason + failing step</text>
<rect x="900" y="310" width="220" height="80" rx="14" fill="#fff1f2" stroke="#be123c" stroke-width="2"/>
<text x="1010.0" y="345.0" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">Aborted</text>
<text x="1010.0" y="371.0" text-anchor="middle" font-size="17" font-weight="normal" fill="#334155">Reason + failing step</text>
<path d="M260,130 L380,130" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M580,130 L900,130" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M160,170 L160,310" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M480,170 L480,235 L160,235 L160,310" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M260,350 L330,350 L330,130 L380,130" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M540,170 L670,310" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M260,350 L560,350" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M580,155 L835,155 L835,350 L900,350" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M160,390 L160,445 L1010,445 L1010,390" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="320" y="111" text-anchor="middle" font-size="17" font-weight="normal" fill="#0f172a">dispatch</text>
<text x="740" y="111" text-anchor="middle" font-size="17" font-weight="normal" fill="#0f172a">all steps succeed</text>
<text x="215" y="220" text-anchor="middle" font-size="17" font-weight="normal" fill="#0f172a">lock wait</text>
<text x="95" y="274" text-anchor="middle" font-size="16" font-weight="normal" fill="#0f172a">initial wait</text>
<text x="290" y="275" text-anchor="middle" font-size="16" font-weight="normal" fill="#0f172a">locks</text>
<text x="290" y="295" text-anchor="middle" font-size="16" font-weight="normal" fill="#0f172a">granted</text>
<text x="705" y="228" text-anchor="middle" font-size="17" font-weight="normal" fill="#0f172a">step failure</text>
<text x="705" y="252" text-anchor="middle" font-size="17" font-weight="normal" fill="#0f172a">DeviceFaulted</text>
<text x="410" y="335" text-anchor="middle" font-size="17" font-weight="normal" fill="#0f172a">DeviceFaulted</text>
<text x="845" y="260" text-anchor="start" font-size="16" font-weight="normal" fill="#0f172a">stop / abort</text>
<text x="590" y="474" text-anchor="middle" font-size="18" font-weight="normal" fill="#0f172a">deadlock victim / stop</text>
</g></svg>
