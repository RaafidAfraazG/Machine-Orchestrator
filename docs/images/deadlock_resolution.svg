<text x="160.0" y="162.5" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">Workflow A</text>
<text x="160.0" y="188.5" text-anchor="middle" font-size="17" font-weight="normal" fill="#334155">Higher priority</text>
<rect x="320" y="135" width="190" height="65" rx="14" fill="#fff1f2" stroke="#be123c" stroke-width="2"/>
<text x="415.0" y="162.5" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">Workflow B</text>
<text x="415.0" y="188.5" text-anchor="middle" font-size="17" font-weight="normal" fill="#334155">Lower priority: victim</text>
<rect x="65" y="310" width="190" height="65" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<text x="160.0" y="337.5" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">Device A</text>
<text x="160.0" y="363.5" text-anchor="middle" font-size="17" font-weight="normal" fill="#334155">Held by A</text>
<rect x="320" y="310" width="190" height="65" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<text x="415.0" y="337.5" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">Device B</text>
<text x="415.0" y="363.5" text-anchor="middle" font-size="17" font-weight="normal" fill="#334155">Held by B</text>
<path d="M160,310 L160,200" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M415,310 L415,200" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M245,200 L385,310" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M330,200 L190,310" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="112" y="260" text-anchor="middle" font-size="16" font-weight="normal" fill="#0f172a">holds</text>
<text x="467" y="260" text-anchor="middle" font-size="16" font-weight="normal" fill="#0f172a">holds</text>
<text x="290" y="285" text-anchor="middle" font-size="17" font-weight="normal" fill="#0f172a">waits</text>
<path d="M565,240 L635,240" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="600" y="215" text-anchor="middle" font-size="16" font-weight="normal" fill="#0f172a">resolve</text>
<rect x="685" y="145" width="205" height="80" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="787.5" y="180.0" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">Workflow A</text>
<text x="787.5" y="206.0" text-anchor="middle" font-size="17" font-weight="normal" fill="#334155">Can continue</text>
<rect x="945" y="145" width="190" height="80" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<text x="1040.0" y="180.0" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">Device B</text>
<text x="1040.0" y="206.0" text-anchor="middle" font-size="17" font-weight="normal" fill="#334155">Available to A</text>
<rect x="685" y="310" width="205" height="65" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<text x="787.5" y="337.5" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">Device A</text>
<text x="787.5" y="363.5" text-anchor="middle" font-size="17" font-weight="normal" fill="#334155">Still held by A</text>
<rect x="945" y="310" width="190" height="65" rx="14" fill="#fff1f2" stroke="#be123c" stroke-width="2"/>
<text x="1040.0" y="337.5" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">Workflow B</text>
<text x="1040.0" y="363.5" text-anchor="middle" font-size="17" font-weight="normal" fill="#334155">Aborted: Deadlock</text>
<path d="M945,185 L890,185" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M787,310 L787,225" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1040,310 L1040,225" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1110" y="272" text-anchor="middle" font-size="16" font-weight="normal" fill="#0f172a">release</text>
<text x="738" y="272" text-anchor="middle" font-size="16" font-weight="normal" fill="#0f172a">kept</text>
<text x="600" y="442" text-anchor="middle" font-size="20" font-weight="normal" fill="#0f172a">Victim policy: lowest priority; youngest submission breaks a tie.</text>
</g></svg>
