<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title">
<title id="title">Deadlock resolution in test-only UNCHECKED mode</title>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs>
<rect x="2" y="2" width="1196" height="466" rx="20" fill="white" stroke="#e2e8f0"/>
<g font-family="DejaVu Sans, sans-serif" fill="#0f172a">
<text x="600.0" y="40" text-anchor="middle" font-size="27" font-weight="bold" fill="#0f172a">Deadlock resolution in test-only UNCHECKED mode</text>
